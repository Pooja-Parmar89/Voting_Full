spring.application.name=voting

# Server
server.port=8089
server.servlet.session.timeout=120m

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/online_voting_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=MySql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=ChangeThisSuperSecretKeyForJwtSigningInProductionEnvironment123456
app.jwt.expiration-ms=86400000

# OTP
# Dev mode: OTPs are printed to the console log instead of being sent via real Email/SMS.
app.otp.dev-mode=true
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# Email (Gmail SMTP) - credentials are loaded from environment variables; do not write them directly in the file
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=infjp@inflibnet.ac.in
spring.mail.password=effzvbwzznlutkes
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# true = OTP will be sent to the real email address (mobile OTP will still remain in the console)
app.mail.enabled=true
app.mail.from=infjp@inflibnet.ac.in

# Whether login requires a second-factor OTP after password check
app.otp.login-required=false

# CORS - Angular dev server
app.cors.allowed-origins=http://localhost:4200

# Default admin bootstrap account (created on first run if it does not exist)
app.admin.email=admin@votingapp.com
app.admin.password=Admin@123

# Logging
logging.level.root=INFO
logging.level.com.votingapp.voting=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
