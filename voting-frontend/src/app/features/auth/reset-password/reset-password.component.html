<div class="auth-shell">
  <div class="card p-4 p-md-5" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock" style="font-size: 2.2rem; color: var(--brand);"></i>
      <h3 class="mt-2 mb-0">Reset Password</h3>
      <p class="text-muted small">Check the backend console for your OTP (dev mode)</p>
    </div>
    <div class="mb-3">
      <label class="form-label">Email or Mobile</label>
      <input class="form-control" [(ngModel)]="identifier">
    </div>
    <div class="mb-3">
      <label class="form-label">OTP Code</label>
      <input class="form-control" [(ngModel)]="code">
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" class="form-control" [(ngModel)]="newPassword">
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" class="form-control" [(ngModel)]="confirmPassword">
    </div>
    <button class="btn btn-brand w-100" (click)="submit()" [disabled]="loading()">
      @if (loading()) { <span class="spinner-border spinner-inline me-2"></span> }
      Reset Password
    </button>
    <p class="text-center small text-muted mt-4 mb-0">
      <a routerLink="/auth/login">Back to login</a>
    </p>
  </div>
</div>
