<div class="auth-shell">
  <div class="card p-4 p-md-5" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-key" style="font-size: 2.2rem; color: var(--brand);"></i>
      <h3 class="mt-2 mb-0">Forgot Password</h3>
      <p class="text-muted small">We'll send an OTP to your registered email</p>
    </div>
    <div class="mb-3">
      <label class="form-label">Email or Mobile Number</label>
      <input class="form-control" [(ngModel)]="identifier">
    </div>
    <button class="btn btn-brand w-100" (click)="submit()" [disabled]="loading()">
      @if (loading()) { <span class="spinner-border spinner-inline me-2"></span> }
      Send OTP
    </button>
    <p class="text-center small text-muted mt-4 mb-0">
      <a routerLink="/auth/login">Back to login</a>
    </p>
  </div>
</div>
