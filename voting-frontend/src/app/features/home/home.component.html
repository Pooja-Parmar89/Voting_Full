<div class="py-5" style="background: linear-gradient(135deg, #eef2ff, #fdf2f8);">
  <div class="container text-center py-5">
    <i class="bi bi-check2-square" style="font-size: 3.5rem; color: var(--brand);"></i>
    <h1 class="mt-3 fw-bold">Secure, Transparent Online Voting</h1>
    <p class="text-muted lead">Register, verify your identity, and cast your vote in a few clicks.</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a routerLink="/auth/register" class="btn btn-brand btn-lg">Get Started</a>
      <a routerLink="/auth/login" class="btn btn-outline-brand btn-lg">Sign In</a>
    </div>
  </div>
</div>

@if (elections().length > 0) {
  <div class="container py-5">
    <h5 class="mb-3">Ongoing & Upcoming Elections</h5>
    <div class="row g-3">
      @for (e of elections(); track e.id) {
        <div class="col-md-4">
          <div class="card p-3 h-100">
            <div class="d-flex justify-content-between align-items-start">
              <h6>{{ e.title }}</h6>
              <app-status-badge [status]="e.status"></app-status-badge>
            </div>
            <p class="text-muted small">{{ e.description }}</p>
            <a routerLink="/auth/login" class="btn btn-sm btn-outline-brand mt-auto">Sign in to view</a>
          </div>
        </div>
      }
    </div>
  </div>
}
